name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Checks
        run: |
          cd backend
          python manage.py check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci || npm install
          npm run build

  deploy-to-vps:
    name: Deploy to VPS (CD)
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

            echo "=== [1/5] Git Pull ==="
            cd /var/www/rebill
            git fetch origin main
            git reset --hard origin/main

            echo "=== [2/5] Frontend Build ==="
            cd /var/www/rebill/frontend
            npm install --silent
            npm run build

            echo "=== [3/5] Backend Dependencies & Migrations ==="
            cd /var/www/rebill/backend
            . venv/bin/activate
            pip install -r requirements.txt -q
            python manage.py migrate --noinput

            echo "=== [4/5] Restart Services ==="
            systemctl restart rebill-backend
            systemctl reload nginx

            echo "=== [5/5] Health Check ==="
            systemctl is-active rebill-backend
            systemctl is-active nginx

            echo "DEPLOYMENT COMPLETE!"
