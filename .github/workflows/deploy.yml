name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Checks
        run: |
          cd backend
          python manage.py check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci || npm install
          npm run build

  deploy-to-vps:
    name: Deploy to VPS (CD)
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via Native SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          TARGET_HOST="${VPS_HOST:-200.141.11.187}"
          TARGET_USER="${VPS_USER:-root}"

          echo "Target VPS: $TARGET_USER@$TARGET_HOST"

          DEPLOY_CMD="set -e; export PATH='/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'; cd /var/www/rebill; git fetch origin main; git reset --hard origin/main; cd frontend; npm install --silent; npm run build; cd ../backend; if [ -d 'venv' ]; then source venv/bin/activate; fi; pip install -r requirements.txt --quiet; python manage.py migrate --noinput; systemctl restart rebill-backend; systemctl reload nginx; systemctl is-active rebill-backend; systemctl is-active nginx; echo 'DEPLOYMENT SUCCESSFUL!'"

          AUTH_SUCCESS=0

          # 1. Try SSH Key if available
          if [ -n "$SSH_KEY" ]; then
            echo "Setting up SSH Key..."
            mkdir -p ~/.ssh
            printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            if ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$TARGET_USER@$TARGET_HOST" "echo Connected via SSH Key" 2>/dev/null; then
              echo "Executing deployment via SSH Key..."
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$TARGET_USER@$TARGET_HOST" "$DEPLOY_CMD"
              AUTH_SUCCESS=1
            else
              echo "SSH Key authentication failed, falling back to password..."
            fi
          fi

          # 2. Try Password with sshpass if SSH Key was not used or failed
          if [ "$AUTH_SUCCESS" -eq 0 ]; then
            if [ -n "$VPS_PASSWORD" ]; then
              echo "Executing deployment via SSH Password..."
              sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 "$TARGET_USER@$TARGET_HOST" "$DEPLOY_CMD"
              AUTH_SUCCESS=1
            fi
          fi

          if [ "$AUTH_SUCCESS" -eq 0 ]; then
            echo "ERROR: Could not authenticate to VPS with SSH Key or Password."
            exit 1
          fi
