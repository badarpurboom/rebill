services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rebill-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - rebill_media:/app/media
      - rebill_static:/app/staticfiles
      - ./backend/db.sqlite3:/app/db.sqlite3
    expose:
      - "8000"
    networks:
      - rebill-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rebill-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rebill-network

volumes:
  rebill_media:
  rebill_static:

networks:
  rebill-network:
    driver: bridge
