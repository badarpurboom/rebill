services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rebill-backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - rebill_media:/app/media
      - rebill_static:/app/staticfiles
      - ./backend/db.sqlite3:/app/db.sqlite3
    expose:
      - "8000"
    networks:
      - rebill-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rebill-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    networks:
      - rebill-network

  mcp-server:
    build:
      context: ./pos-mcp-server
      dockerfile: Dockerfile
    container_name: rebill-mcp
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - API_BASE_URL=http://backend:8000/api/ai
    depends_on:
      - backend
    networks:
      - rebill-network

volumes:
  rebill_media:
  rebill_static:

networks:
  rebill-network:
    driver: bridge
